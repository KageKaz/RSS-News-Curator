name: Daily RSS curation

on:
  schedule:
    # 13:00 UTC every day — adjust to whenever you want your digest ready.
    - cron: "0 16 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run curator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OUTPUT_FEED_LINK: ${{ vars.OUTPUT_FEED_LINK }}
        run: python curate_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          git diff --quiet --cached || git commit -m "Update curated feed"
          git push
